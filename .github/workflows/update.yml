name: 대시보드 자동 갱신

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 대시보드 갱신 스크립트 실행
        run: python scripts/update_dashboard.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "BITCLUB Bot"
          git add site/ data/
          if ! git diff --staged --quiet; then
            git commit -m "🤖 대시보드 자동 갱신: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "변경사항 없음"
          fi
